---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: meshnet-clusterrole
rules:
  - apiGroups:
      - "networkop.co.uk"
    resources:
      - topologies
      - gwirekobjs
    verbs: ["*"]
  - apiGroups:
      - "networkop.co.uk"
    resources:
      - topologies/status
      - gwirekobjs/spec
      - gwirekobjs/status
    verbs: ["*"]
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: meshnet-clusterrolebinding
roleRef:
  kind: ClusterRole
  name: meshnet-clusterrole
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: meshnet
