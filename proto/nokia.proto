syntax = "proto3";

package nokia;

option go_package = "github.com/openconfig/kne/proto/nokia";

// Nokia SR Linux specific config data for KNE, set in Config.vendor_data.
message SRLinuxConfig {
  // Line cards installed in the chassis. When empty, for modular models (ixr6,
  // ixr10, ixr6e, ixr10e) one line card of the model's default type is
  // installed per slot referenced by interface names (eX-Y and eX-Y-Z use
  // slot X); otherwise the model's default line cards are used.
  repeated Component components = 1;
}

// Component is a line card installed in a chassis slot.
message Component {
  // Chassis slot number of the line card.
  uint32 slot = 1;
  // Line card (IMM) model, e.g. "imm36-400g-qsfpdd". When empty, the default
  // line card of the node model is used. Valid values are defined by the
  // srl-controller Srlinux CRD.
  string type = 2;
}
